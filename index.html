<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Yuklab Olish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4FA9FF;
    --primary-dark: #2E8FE8;
    --primary-light: #EAF4FF;
    --bg: #F6FAFF;
    --card: #FFFFFF;
    --text: #1E293B;
    --muted: #7C8CA3;
    --border: #E4EEFA;
    --error: #E85D5D;
    --error-bg: #FDEDED;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body, .card, .video-card, .quality-item, .ai-analysis, .chat-box, .best-btn, .audio-btn, .icon-btn, button, input, select, textarea {
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.2s ease, box-shadow 0.25s ease, transform 0.15s ease, opacity 0.25s ease;
  }
  .fade-in {
    animation: fadeIn 0.35s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ai-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .ai-spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-svg {
    width: 16px; height: 16px;
    display: inline-block;
    vertical-align: -3px;
  }
  .hero-icon svg, .icon-btn svg {
    display: block;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ai-analysis-title {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .glow {
    position: fixed;
    top: -180px;
    left: 50%;
    transform: translateX(-50%);
    width: 520px;
    height: 520px;
    background: radial-gradient(circle, rgba(79,169,255,0.25) 0%, rgba(79,169,255,0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { width: 100%; max-width: 480px; position: relative; z-index: 1; }

  .hero { text-align: center; margin-bottom: 28px; }
  .hero-icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    background: var(--primary);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(79,169,255,0.35);
  }
  .hero-icon svg { width: 26px; height: 26px; }
  h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .hero p { color: var(--muted); font-size: 0.9rem; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 4px 20px rgba(30,41,59,0.06);
  }

  .input-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  input[type="text"]::placeholder { color: #A8B7CC; }

  button.primary {
    padding: 14px 22px;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-dark); }
  button.primary:active:not(:disabled) { transform: scale(0.97); }
  button.primary:disabled { background: #C7D9EC; cursor: not-allowed; }

  .helper-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .link-btn {
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 12.5px;
    color: var(--primary-dark); font-weight: 500;
    padding: 4px 0;
  }
  .link-btn:hover { text-decoration: underline; }

  textarea {
    width: 100%;
    min-height: 100px;
    padding: 14px;
    margin-top: 12px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    resize: vertical;
    display: none;
  }
  textarea.show { display: block; }
  textarea:focus { outline: none; border-color: var(--primary); background: #fff; }

  /* Skeleton */
  .skeleton { margin-top: 16px; }
  .skel-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 4px 20px rgba(30,41,59,0.06);
  }
  .skel-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--border) 25%, #F0F6FC 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  #result { margin-top: 16px; }

  .error {
    color: var(--error);
    background: var(--error-bg);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13.5px;
    font-weight: 500;
  }

  .video-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 4px 20px rgba(30,41,59,0.06);
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
  }
  .video-card img { width: 110px; height: 62px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
  .video-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.35; }
  .video-duration { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .video-channel { font-size: 12px; color: var(--primary-dark); margin-top: 3px; font-weight: 500; }
  .video-description {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--card);
    border-radius: 12px;
    border: 1.5px solid var(--border);
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow-y: auto;
  }
  .video-description.empty {
    color: var(--muted);
    font-style: italic;
  }

  .ai-analysis {
    margin-top: 12px;
    padding: 16px;
    background: linear-gradient(135deg, #EEF6FF 0%, #F5F0FF 100%);
    border-radius: 12px;
    border: 1.5px solid #D6E8FF;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ai-analysis-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  body.dark {
    --primary: #5BB0FF;
    --primary-dark: #3A9AEE;
    --primary-light: #1A2740;
    --bg: #0F172A;
    --card: #1E293B;
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: #334155;
    --error: #F87171;
    --error-bg: #3F1D1D;
  }
  .top-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 12px;
  }
  .icon-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .opts-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .opts-row select {
    flex: 1;
    min-width: 120px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
  }
  .best-btn {
    width: 100%;
    margin-top: 12px;
    margin-bottom: 4px;
    padding: 14px;
    background: linear-gradient(135deg, #4FA9FF, #7C5CFF);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(79,169,255,0.35);
  }
  .best-btn:disabled { opacity: 0.6; cursor: wait; }
  .best-btn:hover:not(:disabled) { filter: brightness(1.05); }
  .copy-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    color: var(--primary-dark);
    font-family: inherit;
  }
  .quality-item .meta-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge-noaudio {
    font-size: 10px;
    color: var(--error);
    font-weight: 600;
  }
  .size-label { color: var(--muted); font-size: 12px; }

  .ai-analysis.empty {
    color: var(--muted);
    font-style: italic;
    background: var(--card);
    border-color: var(--border);
  }

  /* Chat */
  .chat-box {
    margin-top: 16px;
    background: var(--card);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(30,41,59,0.06);
  }
  .chat-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    border-bottom: 1.5px solid var(--border);
    background: var(--primary-light);
  }
  .chat-messages {
    max-height: 280px;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.bot {
    align-self: flex-start;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .chat-msg.typing {
    color: var(--muted);
    font-style: italic;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1.5px solid var(--border);
  }
  .chat-input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    background: var(--bg);
    color: var(--text);
  }
  .chat-input-row input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  .chat-input-row button {
    padding: 12px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .chat-input-row button:disabled {
    background: #C7D9EC;
    cursor: not-allowed;
  }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 16px 4px 8px;
  }

  .audio-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: #fff;
    text-decoration: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(79,169,255,0.3);
  }
  .audio-btn:hover { background: var(--primary-dark); }
  .audio-btn:disabled { opacity: 0.7; cursor: wait; }

  .quality-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .quality-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .quality-item:disabled { opacity: 0.6; cursor: wait; }
  .quality-item .ext { color: var(--muted); font-weight: 400; }

  .progress-wrap {
    margin-top: 12px;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  .progress-current {
    font-size: 12px;
    color: var(--text);
    margin-top: 8px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playlist-header {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text);
  }
  .playlist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .playlist-item:hover { background: var(--primary-light); }
  .playlist-item img { width: 56px; height: 32px; object-fit: cover; border-radius: 6px; }

  .history { margin-top: 24px; }
  .history-title { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; padding: 0 4px; }
  .history-item {
    font-size: 13px;
    color: var(--muted);
    padding: 10px 14px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover { background: var(--primary-light); color: var(--primary-dark); }

  @media (max-width: 380px) {
    .input-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">

  <div class="top-bar">
    <button class="icon-btn" id="themeBtn" type="button">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
      <span id="themeLabel">Dark</span>
    </button>
  </div>
  <div class="hero">
    <div class="hero-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3v13m0 0l-4-4m4 4l4-4M5 20h14" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Video yuklab olish</h1>
    <p>YouTube linkini joylang, formatni tanlang</p>
  </div>

  <div class="card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="youtube.com/watch?v=..." autocomplete="off">
      <button class="primary" id="searchBtn" onclick="handleSearch()">Qidirish</button>
    </div>
    <div class="opts-row">
      <select id="langSelect">
        <option value="uz">O'zbek</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
      <select id="modeSelect">
        <option value="short">Qisqa tahlil</option>
        <option value="detailed">Batafsil tahlil</option>
      </select>
    </div>
    <div class="helper-row">
      <button class="link-btn" onclick="pasteFromClipboard()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
        Bufer bilan joylash</button>
      <button class="link-btn" onclick="toggleBatch()">+ Bir nechta link</button>
    </div>
    <textarea id="batchInput" placeholder="Har qatorga bitta link..."></textarea>
    <button class="primary" id="batchBtn" style="display:none; width:100%; margin-top:8px;" onclick="handleBatch()">Barchasini yuklash</button>
  </div>

  <div id="result"></div>

  <div class="history" id="historyBox" style="display:none">
    <div class="history-title">Oxirgi qidiruvlar</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const urlInput = document.getElementById("urlInput");
const searchBtn = document.getElementById("searchBtn");
const batchInput = document.getElementById("batchInput");
const batchBtn = document.getElementById("batchBtn");
const resultDiv = document.getElementById("result");
const langSelect = document.getElementById("langSelect");
const modeSelect = document.getElementById("modeSelect");
const themeBtn = document.getElementById("themeBtn");
let downloadBusy = false;

// Theme
function updateThemeLabel() {
  const label = document.getElementById("themeLabel");
  if (!label) return;
  label.textContent = document.body.classList.contains("dark") ? "Light" : "Dark";
}
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}
updateThemeLabel();
if (themeBtn) {
  themeBtn.onclick = () => {
    document.body.classList.toggle("dark");
    const dark = document.body.classList.contains("dark");
    localStorage.setItem("theme", dark ? "dark" : "light");
    updateThemeLabel();
  };
}
if (langSelect) langSelect.value = localStorage.getItem("lang") || "uz";
if (modeSelect) modeSelect.value = localStorage.getItem("mode") || "short";
if (langSelect) langSelect.onchange = () => localStorage.setItem("lang", langSelect.value);
if (modeSelect) modeSelect.onchange = () => localStorage.setItem("mode", modeSelect.value);

const historyBox = document.getElementById("historyBox");
const historyList = document.getElementById("historyList");

const HISTORY_KEY = "ytdmr_history";
let lastRequestTime = 0;
const RATE_LIMIT_MS = 1500;

urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleSearch(); });

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (text.includes("youtu")) {
      urlInput.value = text.trim();
    } else {
      showError("Bufer(clipboard)da YouTube link topilmadi");
    }
  } catch (e) {
    showError("Bufer(clipboard)ga ruxsat berilmadi");
  }
}

function toggleBatch() {
  batchInput.classList.toggle("show");
  batchBtn.style.display = batchInput.classList.contains("show") ? "block" : "none";
}

function isRateLimited() {
  const now = Date.now();
  if (now - lastRequestTime < RATE_LIMIT_MS) return true;
  lastRequestTime = now;
  return false;
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}
function addToHistory(url, title) {
  let history = getHistory().filter((h) => h.url !== url);
  history.unshift({ url, title: title || url, time: Date.now() });
  history = history.slice(0, 5);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}
function renderHistory() {
  const history = getHistory();
  if (!history.length) { historyBox.style.display = "none"; return; }
  historyBox.style.display = "block";
  historyList.innerHTML = "";
  history.forEach((h) => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = h.title;
    div.onclick = () => { urlInput.value = h.url; handleSearch(); };
    historyList.appendChild(div);
  });
}
renderHistory();

function setLoading(isLoading) {
  searchBtn.disabled = isLoading;
  searchBtn.textContent = isLoading ? "..." : "Qidirish";
}
function showSkeleton() {
  resultDiv.innerHTML = `
    <div class="skeleton">
      <div class="skel-card">
        <div class="skel-line" style="width:70%"></div>
        <div class="skel-line" style="width:45%"></div>
        <div class="skel-line" style="width:90%; margin-top:14px;"></div>
      </div>
    </div>`;
}
function showError(message) {
  resultDiv.innerHTML = "";
  const div = document.createElement("div");
  div.className = "error";
  div.textContent = message;
  resultDiv.appendChild(div);
}
function formatDuration(seconds) {
  if (!seconds) return null;
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

async function handleSearch() {
  const url = urlInput.value.trim();
  if (!url) { showError("Iltimos, link kiriting"); return; }
  if (isRateLimited()) { showError("Biroz kuting, keyin qayta urinib ko'ring"); return; }

  setLoading(true);
  showSkeleton();

  try {
    const lang = (langSelect && langSelect.value) || "uz";
    const mode = (modeSelect && modeSelect.value) || "short";
    const response = await fetch(`/api/video?url=${encodeURIComponent(url)}&lang=${lang}&mode=${mode}`);
    const data = await response.json();

    if (!response.ok) {
      showError(data.error || "Xatolik yuz berdi");
      return;
    }

    if (data.type === "playlist") {
      renderPlaylist(data);
    } else {
      renderVideo(data, url);
      addToHistory(url, data.title);
    }
  } catch (err) {
    showError("Server bilan bog'lanib bo'lmadi");
  } finally {
    setLoading(false);
  }
}

function renderVideo(data, originalUrl) {
  resultDiv.innerHTML = "";

  const card = document.createElement("div");
  card.className = "video-card fade-in";
  if (data.thumbnail) {
    const img = document.createElement("img");
    img.src = data.thumbnail;
    card.appendChild(img);
  }
  const meta = document.createElement("div");
  const title = document.createElement("div");
  title.className = "video-title";
  title.textContent = data.title;
  meta.appendChild(title);

  if (data.channel) {
    const ch = document.createElement("div");
    ch.className = "video-channel";
    ch.textContent = data.channel;
    meta.appendChild(ch);
  }

  const dur = formatDuration(data.lengthSeconds);
  if (dur) {
    const durEl = document.createElement("div");
    durEl.className = "video-duration";
    durEl.textContent = dur + (data.viewCount ? ` · ${data.viewCount}` : "");
    meta.appendChild(durEl);
  }
  card.appendChild(meta);
  resultDiv.appendChild(card);

  // AI tahlil — alohida, download ro'yxatini to'smaydi
  const aiBox = document.createElement("div");
  aiBox.className = "ai-analysis fade-in";
  aiBox.innerHTML = `<div class="ai-loading"><div class="ai-spinner"></div><span>AI tahlil yuklanmoqda...</span></div>`;
  resultDiv.appendChild(aiBox);

  // async AI
  (async () => {
    try {
      const lang = (langSelect && langSelect.value) || "uz";
      const mode = (modeSelect && modeSelect.value) || "short";
      const src = originalUrl || "";
      const res = await fetch(`/api/analyze?url=${encodeURIComponent(src)}&lang=${lang}&mode=${mode}`);
      const j = await res.json();
      if (!res.ok) {
        aiBox.className = "ai-analysis empty fade-in";
        aiBox.textContent = "AI xato: " + (j.error || "noma'lum");
        mountChat(src, null);
        return;
      }
      const text = j.analysis;
      aiBox.innerHTML = "";
      aiBox.className = "ai-analysis fade-in";
      const aiTitle = document.createElement("div");
      aiTitle.className = "ai-analysis-title";
      aiTitle.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/></svg> AI tahlil`;
      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "Nusxa";
      copyBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Nusxa olindi";
          setTimeout(() => (copyBtn.textContent = "Nusxa"), 1500);
        } catch { copyBtn.textContent = "Xato"; }
      };
      aiTitle.appendChild(copyBtn);
      aiBox.appendChild(aiTitle);
      const aiText = document.createElement("div");
      aiText.textContent = text;
      aiBox.appendChild(aiText);
      // chat after analysis
      const oldChat = resultDiv.querySelector(".chat-box");
      if (oldChat) oldChat.remove();
      mountChat(src, text);
    } catch (e) {
      aiBox.className = "ai-analysis empty fade-in";
      aiBox.textContent = "AI tarmoq xatosi";
      mountChat(originalUrl || "", null);
    }
  })();

  // YouTube description (metadata)
  if (data.description) {
    const descBox = document.createElement("div");
    descBox.className = "video-description";
    descBox.textContent = data.description;
    resultDiv.appendChild(descBox);
  }

  if (!data.items || !data.items.length) {
    showError("Yuklab olish uchun formatlar topilmadi");
    return;
  }

  const safeTitle = (data.title || "video").replace(/[\\/:*?"<>|]/g, "").slice(0, 80);

  const audioOnly = data.items.find((i) => i.hasAudio && (i.extension === "mp3" || i.extension === "m4a" || !i.quality));
  if (audioOnly) {
    const a = document.createElement("button");
    a.type = "button";
    a.className = "audio-btn";
    a.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Faqat audio yuklab olish`;
    a.onclick = () => forceDownload(audioOnly.url, `${safeTitle}.${audioOnly.extension || "m4a"}`, a);
    resultDiv.appendChild(a);
  }

  const videoItems = data.items.filter((i) => i.extension !== "mp3");
  if (videoItems.length) {
    // Eng yaxshi format (eng yuqori sifat + audio)
    const ranked = [...videoItems].sort((a, b) => {
      const qa = parseInt(String(a.quality || "0"), 10) || 0;
      const qb = parseInt(String(b.quality || "0"), 10) || 0;
      if (qb !== qa) return qb - qa;
      return (b.hasAudio === false ? 0 : 1) - (a.hasAudio === false ? 0 : 1);
    });
    const best = ranked.find((i) => i.hasAudio !== false) || ranked[0];
    if (best) {
      const bestBtn = document.createElement("button");
      bestBtn.type = "button";
      bestBtn.className = "best-btn";
      const sz = formatSize(best.size);
      bestBtn.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Eng yaxshi: ${best.quality || "HD"} ${best.extension || "mp4"}${sz ? " · " + sz : ""}`;
      bestBtn.onclick = () => forceDownload(best.url, `${safeTitle}_${best.quality || "best"}.${best.extension || "mp4"}`, bestBtn);
      resultDiv.appendChild(bestBtn);
    }

    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = "VIDEO FORMATLAR";
    resultDiv.appendChild(label);
    videoItems.forEach((item) => resultDiv.appendChild(makeQualityLink(item, safeTitle)));
  }

  // Chat AI tahlildan keyin ochiladi (yuqorida async)
}

function mountChat(videoUrl, initialAnalysis) {
  const history = [];
  if (initialAnalysis) {
    history.push({ role: "assistant", text: initialAnalysis });
  }

  const box = document.createElement("div");
  box.className = "chat-box";
  box.innerHTML = `
    <div class="chat-header"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg> Video bo'yicha suhbat</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Video haqida savol yozing..." autocomplete="off">
      <button id="chatSend">Yuborish</button>
    </div>
  `;
  resultDiv.appendChild(box);

  const messagesEl = box.querySelector("#chatMessages");
  const inputEl = box.querySelector("#chatInput");
  const sendBtn = box.querySelector("#chatSend");

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "chat-msg " + (role === "user" ? "user" : "bot");
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  if (initialAnalysis) {
    addMsg("assistant", initialAnalysis);
  } else {
    addMsg("assistant", "Salom! Video haqida savol bering.");
  }

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = "";
    sendBtn.disabled = true;
    addMsg("user", msg);
    history.push({ role: "user", text: msg });

    const typing = document.createElement("div");
    typing.className = "chat-msg bot typing";
    typing.textContent = "Yozmoqda...";
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          videoUrl,
          message: msg,
          history: history.slice(0, -1), // oxirgi user xabarsiz (uni message sifatida yubordik)
        }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addMsg("assistant", "Xato: " + (data.error || "javob kelmadi"));
      } else {
        addMsg("assistant", data.reply);
        history.push({ role: "assistant", text: data.reply });
      }
    } catch (e) {
      typing.remove();
      addMsg("assistant", "Tarmoq xatosi. Qayta urinib ko'ring.");
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.onclick = send;
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
}

function formatSize(size) {
  if (size == null || size === "") return null;
  if (typeof size === "string" && /mb|kb|gb/i.test(size)) return size;
  const n = Number(size);
  if (!n || n < 0) return null;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

function makeQualityLink(item, safeTitle) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "quality-item";
  const left = document.createElement("span");
  left.textContent = item.quality || "N/A";
  btn.appendChild(left);

  const right = document.createElement("span");
  right.className = "meta-right";
  if (item.hasAudio === false) {
    const badge = document.createElement("span");
    badge.className = "badge-noaudio";
    badge.textContent = "no audio";
    right.appendChild(badge);
  }
  const sz = formatSize(item.size);
  if (sz) {
    const s = document.createElement("span");
    s.className = "size-label";
    s.textContent = sz;
    right.appendChild(s);
  }
  const ext = document.createElement("span");
  ext.className = "ext";
  ext.textContent = item.extension || "?";
  right.appendChild(ext);
  btn.appendChild(right);

  const filename = `${safeTitle || "video"}_${item.quality || "video"}.${item.extension || "mp4"}`;
  btn.onclick = () => forceDownload(item.url, filename, btn);
  return btn;
}

function setBtnProgress(btn, text) {
  if (!btn) return;
  if (btn.classList.contains("quality-item")) {
    const ext = btn.querySelector(".ext") || btn.querySelector("span:last-child");
    if (ext) ext.textContent = text;
  } else if (btn.classList.contains("best-btn") || btn.classList.contains("audio-btn")) {
    btn.textContent = text;
  } else {
    btn.textContent = text;
  }
}

function forceDownload(url, filename, btn) {
  if (!url) return;
  if (downloadBusy) {
    alert("Boshqa yuklash tugaguncha kuting");
    return;
  }
  downloadBusy = true;
  const original = btn ? btn.innerHTML : null;
  if (btn) {
    btn.disabled = true;
    setBtnProgress(btn, "0%");
  }

  const xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.responseType = "blob";

  xhr.onprogress = (e) => {
    if (!btn) return;
    if (e.lengthComputable && e.total > 0) {
      const pct = Math.min(100, Math.round((e.loaded / e.total) * 100));
      setBtnProgress(btn, pct + "%");
    } else if (e.loaded > 0) {
      // total noma'lum — MB ko'rsatamiz
      const mb = (e.loaded / (1024 * 1024)).toFixed(1);
      setBtnProgress(btn, mb + " MB");
    }
  };

  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      if (btn) setBtnProgress(btn, "100%");
      const blob = xhr.response;
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objUrl), 3000);
      if (btn) {
        setTimeout(() => {
          btn.disabled = false;
          if (original) btn.innerHTML = original;
          downloadBusy = false;
        }, 600);
      } else {
        downloadBusy = false;
      }
    } else {
      // HTTP xato — fallback
      fallbackOpen(url, filename, btn, original);
    }
  };

  xhr.onerror = () => {
    // CORS yoki tarmoq xatosi — fallback
    fallbackOpen(url, filename, btn, original);
  };

  xhr.send();
}

function fallbackOpen(url, filename, btn, original) {
  if (btn) setBtnProgress(btn, "↓");
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (btn) {
    setTimeout(() => {
      btn.disabled = false;
      if (original) btn.innerHTML = original;
      downloadBusy = false;
    }, 800);
  } else {
    downloadBusy = false;
  }
}

function renderPlaylist(data) {
  resultDiv.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  const header = document.createElement("div");
  header.className = "playlist-header";
  header.textContent = `${data.title} — ${data.videos.length} ta video`;
  card.appendChild(header);

  data.videos.forEach((v) => {
    const row = document.createElement("div");
    row.className = "playlist-item";
    if (v.thumbnail) {
      const img = document.createElement("img");
      img.src = v.thumbnail;
      row.appendChild(img);
    }
    const span = document.createElement("span");
    span.textContent = v.duration ? `${v.title} (${v.duration})` : v.title;
    row.appendChild(span);
    row.onclick = () => {
      urlInput.value = `https://youtube.com/watch?v=${v.id}`;
      handleSearch();
    };
    card.appendChild(row);
  });

  const downloadAllBtn = document.createElement("button");
  downloadAllBtn.className = "primary";
  downloadAllBtn.style.width = "100%";
  downloadAllBtn.style.marginTop = "14px";
  downloadAllBtn.textContent = `Barchasini yuklab olish (${data.videos.length})`;
  card.appendChild(downloadAllBtn);

  const progressWrap = document.createElement("div");
  progressWrap.className = "progress-wrap";
  progressWrap.style.display = "none";
  progressWrap.innerHTML = `
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="progress-label"><span class="progress-count">0/${data.videos.length}</span><span class="progress-pct">0%</span></div>
    <div class="progress-current"></div>
  `;
  card.appendChild(progressWrap);

  downloadAllBtn.onclick = () => downloadAllPlaylist(data.videos, downloadAllBtn, progressWrap);

  const note = document.createElement("div");
  note.style.fontSize = "11.5px";
  note.style.color = "var(--muted)";
  note.style.marginTop = "8px";
  note.textContent = "Har bir video birma-bir, brauzeringiz orqali yuklanadi (ZIP emas). Brauzer bir nechta faylni birdan yuklashga ruxsat so'rashi mumkin.";
  card.appendChild(note);

  resultDiv.appendChild(card);
}

// ---------- Playlist: hammasini birma-bir yuklab olish (real progress bilan) ----------
async function downloadAllPlaylist(videos, btn, progressWrap) {
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Yuklanmoqda...";

  progressWrap.style.display = "block";
  const fill = progressWrap.querySelector(".progress-fill");
  const countLabel = progressWrap.querySelector(".progress-count");
  const pctLabel = progressWrap.querySelector(".progress-pct");
  const currentLabel = progressWrap.querySelector(".progress-current");

  let successCount = 0;

  for (let i = 0; i < videos.length; i++) {
    currentLabel.textContent = `⬇ ${videos[i].title}`;
    const videoUrl = `https://youtube.com/watch?v=${videos[i].id}`;
    try {
      const response = await fetch(`/api/video?url=${encodeURIComponent(videoUrl)}`);
      const data = await response.json();
      if (response.ok && data.items && data.items.length) {
        const best = data.items.find((it) => it.extension !== "mp3") || data.items[0];
        const a = document.createElement("a");
        a.href = best.url;
        a.download = `${data.title || videos[i].id}.${best.extension || "mp4"}`;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        successCount++;
      }
    } catch (e) {
      console.error(`${videos[i].id} yuklanmadi:`, e);
    }

    // Real progress: har video tugagach darhol yangilanadi
    const percent = Math.round(((i + 1) / videos.length) * 100);
    fill.style.width = `${percent}%`;
    countLabel.textContent = `${i + 1}/${videos.length}`;
    pctLabel.textContent = `${percent}%`;

    await new Promise((r) => setTimeout(r, 1200));
  }

  currentLabel.textContent = `✓ Tugadi — ${successCount}/${videos.length} muvaffaqiyatli`;
  btn.textContent = originalText;
  btn.disabled = false;
}

async function handleBatch() {
  const urls = batchInput.value.split("\n").map((u) => u.trim()).filter(Boolean);
  if (!urls.length) { showError("Hech bo'lmaganda bitta link kiriting"); return; }

  batchBtn.disabled = true;
  resultDiv.innerHTML = "";

  const progressWrap = document.createElement("div");
  progressWrap.className = "progress-wrap";
  progressWrap.innerHTML = `
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="progress-label"><span class="progress-count">0/${urls.length}</span><span class="progress-pct">0%</span></div>
  `;
  resultDiv.appendChild(progressWrap);
  const fill = progressWrap.querySelector(".progress-fill");
  const countLabel = progressWrap.querySelector(".progress-count");
  const pctLabel = progressWrap.querySelector(".progress-pct");

  for (let i = 0; i < urls.length; i++) {
    try {
      const response = await fetch(`/api/video?url=${encodeURIComponent(urls[i])}`);
      const data = await response.json();
      if (response.ok && data.type === "video") {
        const card = document.createElement("div");
        card.className = "video-card fade-in";
        const meta = document.createElement("div");
        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = data.title;
        meta.appendChild(title);
        if (data.items && data.items[0]) {
          meta.appendChild(makeQualityLink(data.items[0]));
        }
        card.appendChild(meta);
        resultDiv.appendChild(card);
        addToHistory(urls[i], data.title);
      } else {
        const err = document.createElement("div");
        err.className = "error";
        err.style.marginBottom = "10px";
        err.textContent = `${urls[i]}: ${data.error || "xatolik"}`;
        resultDiv.appendChild(err);
      }
    } catch (e) {
      const err = document.createElement("div");
      err.className = "error";
      err.style.marginBottom = "10px";
      err.textContent = `${urls[i]}: tarmoq xatoligi`;
      resultDiv.appendChild(err);
    }

    const percent = Math.round(((i + 1) / urls.length) * 100);
    fill.style.width = `${percent}%`;
    countLabel.textContent = `${i + 1}/${urls.length}`;
    pctLabel.textContent = `${percent}%`;

    await new Promise((r) => setTimeout(r, 800));
  }
  batchBtn.disabled = false;
}
