<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: #0a0a0a;
    background-image:
      linear-gradient(rgba(74,222,128,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #d4d4d4;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.3rem;
    color: #4ade80;
    margin-bottom: 4px;
  }
  h1::before { content: "$ "; opacity: 0.6; }
  .subtitle { color: #666; font-size: 0.8rem; margin-bottom: 24px; }

  .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #eee;
    font-family: inherit;
    font-size: 13px;
  }
  input[type="text"]:focus { outline: none; border-color: #4ade80; }
  button {
    padding: 12px 18px;
    background: #4ade80;
    border: none;
    border-radius: 6px;
    color: #0a0a0a;
    font-weight: 700;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #86efac; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #999;
  }
  .btn-ghost:hover:not(:disabled) { border-color: #4ade80; color: #4ade80; }

  .paste-hint {
    font-size: 11px;
    color: #555;
    margin-bottom: 20px;
    cursor: pointer;
    display: inline-block;
  }
  .paste-hint:hover { color: #4ade80; }

  .batch-toggle { font-size: 11px; color: #555; margin-bottom: 12px; cursor: pointer; }
  .batch-toggle:hover { color: #4ade80; }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #eee;
    font-family: inherit;
    font-size: 12px;
    margin-bottom: 8px;
    resize: vertical;
    display: none;
  }
  textarea.show { display: block; }

  /* Skeleton loader */
  .skeleton { padding: 16px; background: #111; border-radius: 8px; margin-top: 16px; }
  .skel-line {
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  #result { margin-top: 16px; }
  .status { color: #888; font-size: 12px; }
  .error {
    color: #f87171;
    font-size: 12px;
    background: #1a0f0f;
    border: 1px solid #3a1a1a;
    padding: 10px 12px;
    border-radius: 6px;
  }

  .video-card {
    display: flex;
    gap: 12px;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .video-card img { width: 120px; height: 68px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .video-card .meta { min-width: 0; }
  .video-title { font-size: 13px; color: #eee; word-break: break-word; margin-bottom: 4px; }
  .video-duration { font-size: 11px; color: #666; }

  .fmt-group-label { font-size: 11px; color: #4ade80; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .quality-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #111;
    border: 1px solid #222;
    border-radius: 6px;
    color: #d4d4d4;
    text-decoration: none;
    font-size: 12px;
  }
  .quality-item:hover { border-color: #4ade80; color: #4ade80; }
  .audio-only-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    background: #1a2e1a;
    border: 1px solid #4ade80;
    border-radius: 6px;
    color: #4ade80;
    text-decoration: none;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
  }
  .audio-only-btn:hover { background: #4ade80; color: #0a0a0a; }

  .history { margin-top: 28px; }
  .history-title { font-size: 11px; color: #555; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
  .history-item {
    font-size: 12px;
    color: #777;
    padding: 6px 10px;
    background: #0f0f0f;
    border: 1px solid #1a1a1a;
    border-radius: 4px;
    margin-bottom: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover { border-color: #333; color: #aaa; }

  .playlist-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px;
    border-bottom: 1px solid #1a1a1a;
    font-size: 12px;
  }
  .playlist-item img { width: 60px; height: 34px; object-fit: cover; border-radius: 3px; }
  .batch-progress { font-size: 11px; color: #4ade80; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>yt-downloader</h1>
  <p class="subtitle">video / shorts / playlist link tashla</p>

  <div class="input-row">
    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." autocomplete="off">
    <button id="searchBtn" onclick="handleSearch()">Qidirish</button>
  </div>
  <span class="paste-hint" onclick="pasteFromClipboard()">📋 clipboard'dan joylash</span>
  <div class="batch-toggle" onclick="toggleBatch()">+ bir nechta linkni birdan yuklash</div>
  <textarea id="batchInput" placeholder="Har qatorga bitta link:
https://youtube.com/watch?v=...
https://youtube.com/watch?v=..."></textarea>
  <button id="batchBtn" class="btn-ghost" style="display:none" onclick="handleBatch()">Barchasini qidirish</button>

  <div id="result"></div>

  <div class="history" id="historyBox" style="display:none">
    <div class="history-title">Oxirgi qidiruvlar</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
const urlInput = document.getElementById("urlInput");
const searchBtn = document.getElementById("searchBtn");
const batchInput = document.getElementById("batchInput");
const batchBtn = document.getElementById("batchBtn");
const resultDiv = document.getElementById("result");
const historyBox = document.getElementById("historyBox");
const historyList = document.getElementById("historyList");

const HISTORY_KEY = "ytdmr_history";
let lastRequestTime = 0;
const RATE_LIMIT_MS = 1500; // debounce: shu vaqt ichida qayta so'rov yubormaydi

urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleSearch(); });

// ---------- Clipboard auto-paste ----------
async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (text.includes("youtu")) {
      urlInput.value = text.trim();
    } else {
      showError("Clipboard'da YouTube link topilmadi");
    }
  } catch (e) {
    showError("Clipboard'ga ruxsat berilmadi (brauzer bloklagan bo'lishi mumkin)");
  }
}

// ---------- Batch toggle ----------
function toggleBatch() {
  batchInput.classList.toggle("show");
  batchBtn.style.display = batchInput.classList.contains("show") ? "block" : "none";
}

// ---------- Rate limit guard ----------
function isRateLimited() {
  const now = Date.now();
  if (now - lastRequestTime < RATE_LIMIT_MS) return true;
  lastRequestTime = now;
  return false;
}

// ---------- History (localStorage) ----------
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}
function addToHistory(url, title) {
  let history = getHistory().filter((h) => h.url !== url);
  history.unshift({ url, title: title || url, time: Date.now() });
  history = history.slice(0, 5);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}
function renderHistory() {
  const history = getHistory();
  if (!history.length) { historyBox.style.display = "none"; return; }
  historyBox.style.display = "block";
  historyList.innerHTML = "";
  history.forEach((h) => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = h.title;
    div.onclick = () => { urlInput.value = h.url; handleSearch(); };
    historyList.appendChild(div);
  });
}
renderHistory();

// ---------- UI helpers ----------
function setLoading(isLoading) {
  searchBtn.disabled = isLoading;
  searchBtn.textContent = isLoading ? "..." : "Qidirish";
}
function showSkeleton() {
  resultDiv.innerHTML = `
    <div class="skeleton">
      <div class="skel-line" style="width:60%"></div>
      <div class="skel-line" style="width:90%"></div>
      <div class="skel-line" style="width:40%"></div>
    </div>`;
}
function showError(message) {
  resultDiv.innerHTML = "";
  const div = document.createElement("div");
  div.className = "error";
  div.textContent = message;
  resultDiv.appendChild(div);
}
function formatDuration(seconds) {
  if (!seconds) return null;
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// ---------- Single search ----------
async function handleSearch() {
  const url = urlInput.value.trim();
  if (!url) { showError("Iltimos, URL kiriting"); return; }
  if (isRateLimited()) { showError("Juda tez-tez so'rov yuboryapsiz, biroz kuting"); return; }

  setLoading(true);
  showSkeleton();

  try {
    const response = await fetch(`/api/video?url=${encodeURIComponent(url)}`);
    const data = await response.json();

    if (!response.ok) {
      showError(data.error || "Xatolik yuz berdi");
      return;
    }

    if (data.type === "playlist") {
      renderPlaylist(data);
    } else {
      renderVideo(data);
      addToHistory(url, data.title);
    }
  } catch (err) {
    showError("Tarmoq xatoligi: server bilan bog'lanib bo'lmadi");
  } finally {
    setLoading(false);
  }
}

// ---------- Render single video ----------
function renderVideo(data) {
  resultDiv.innerHTML = "";

  const card = document.createElement("div");
  card.className = "video-card";
  if (data.thumbnail) {
    const img = document.createElement("img");
    img.src = data.thumbnail;
    card.appendChild(img);
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  const title = document.createElement("div");
  title.className = "video-title";
  title.textContent = data.title;
  meta.appendChild(title);
  const dur = formatDuration(data.lengthSeconds);
  if (dur) {
    const durEl = document.createElement("div");
    durEl.className = "video-duration";
    durEl.textContent = dur;
    meta.appendChild(durEl);
  }
  card.appendChild(meta);
  resultDiv.appendChild(card);

  if (!data.items || !data.items.length) {
    showError("Yuklab olish uchun formatlar topilmadi");
    return;
  }

  // Audio-only tez tugma (eng yuqori sifatli audio-only variant)
  const audioOnly = data.items.find((i) => i.hasAudio && (i.extension === "mp3" || i.extension === "m4a" || !i.quality));
  if (audioOnly) {
    const a = document.createElement("a");
    a.href = audioOnly.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "audio-only-btn";
    a.textContent = "🎵 Faqat audio (MP3) yuklab olish";
    resultDiv.appendChild(a);
  }

  const videoItems = data.items.filter((i) => i.extension !== "mp3");
  if (videoItems.length) {
    const label = document.createElement("div");
    label.className = "fmt-group-label";
    label.textContent = "Video formatlar";
    resultDiv.appendChild(label);
    videoItems.forEach((item) => resultDiv.appendChild(makeQualityLink(item)));
  }
}

function makeQualityLink(item) {
  const a = document.createElement("a");
  a.href = item.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.className = "quality-item";
  const left = document.createElement("span");
  left.textContent = item.quality || "N/A";
  const right = document.createElement("span");
  right.textContent = item.extension || "?";
  a.appendChild(left);
  a.appendChild(right);
  return a;
}

// ---------- Render playlist ----------
function renderPlaylist(data) {
  resultDiv.innerHTML = "";
  const label = document.createElement("div");
  label.className = "fmt-group-label";
  label.textContent = `Playlist: ${data.title} (${data.videos.length} ta video)`;
  resultDiv.appendChild(label);

  data.videos.forEach((v) => {
    const row = document.createElement("div");
    row.className = "playlist-item";
    if (v.thumbnail) {
      const img = document.createElement("img");
      img.src = v.thumbnail;
      row.appendChild(img);
    }
    const span = document.createElement("span");
    span.textContent = v.title;
    row.appendChild(span);
    row.style.cursor = "pointer";
    row.onclick = () => {
      urlInput.value = `https://youtube.com/watch?v=${v.id}`;
      handleSearch();
    };
    resultDiv.appendChild(row);
  });
}

// ---------- Batch mode ----------
async function handleBatch() {
  const urls = batchInput.value
    .split("\n")
    .map((u) => u.trim())
    .filter(Boolean);

  if (!urls.length) { showError("Hech bo'lmaganda bitta link kiriting"); return; }

  batchBtn.disabled = true;
  resultDiv.innerHTML = "";
  const progress = document.createElement("div");
  progress.className = "batch-progress";
  resultDiv.appendChild(progress);

  for (let i = 0; i < urls.length; i++) {
    progress.textContent = `Yuklanmoqda: ${i + 1}/${urls.length}`;
    try {
      const response = await fetch(`/api/video?url=${encodeURIComponent(urls[i])}`);
      const data = await response.json();
      if (response.ok && data.type === "video") {
        const card = document.createElement("div");
        card.className = "video-card";
        const meta = document.createElement("div");
        meta.className = "meta";
        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = data.title;
        meta.appendChild(title);
        if (data.items && data.items[0]) {
          meta.appendChild(makeQualityLink(data.items[0]));
        }
        card.appendChild(meta);
        resultDiv.appendChild(card);
        addToHistory(urls[i], data.title);
      } else {
        const err = document.createElement("div");
        err.className = "error";
        err.textContent = `${urls[i]}: ${data.error || "xatolik"}`;
        resultDiv.appendChild(err);
      }
    } catch (e) {
      const err = document.createElement("div");
      err.className = "error";
      err.textContent = `${urls[i]}: tarmoq xatoligi`;
      resultDiv.appendChild(err);
    }
    // Rate limit himoyasi: har so'rov orasida kichik pauza
    await new Promise((r) => setTimeout(r, 800));
  }
  progress.textContent = `Tugadi: ${urls.length}/${urls.length}`;
  batchBtn.disabled = false;
}
</script>
</body>
</html>
